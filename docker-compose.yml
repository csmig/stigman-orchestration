# STIG Manager with proxy for https

services:
  nginx:
    image: nginx:latest
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - /home/csmig/dev/x509/certs/servers/neo-2.localdomain/cert.pem:/etc/nginx/cert.pem
      - /home/csmig/dev/x509/certs/servers/neo-2.localdomain/privkey.pem:/etc/nginx/privkey.pem
      - ./nginx/index.html:/usr/share/nginx/html/index.html
    ports:
    - "443:443"
  keycloak:
    image: nuwcdivnpt/stig-manager-auth:latest
    environment:
      - KC_PROXY_HEADERS=xforwarded
      - KC_HOSTNAME_STRICT=false
      - KC_HTTP_RELATIVE_PATH=/kc
      # uncomment below to persist Keycloak data
      # - ./kc/h2:/opt/keycloak/data/h2
